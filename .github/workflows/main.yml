name: Build and Package Rootless

on:
  push:
    branches: [ rootless ]
  pull_request:
    branches: [ rootless ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      DERIVED_DATA: ${{ github.workspace }}/.derivedData
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install ldid
        run: brew install ldid

      - name: Build .app with Xcode
        run: |
          rm -rf "$DERIVED_DATA" Payload varClean15.tipa
          xcodebuild -project varClean.xcodeproj \
                     -scheme varClean \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath "$DERIVED_DATA" \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0 \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     build

      - name: Locate .app File and Prepare for Packaging
        run: |
          mkdir -p Payload
          APP_DIR="${DERIVED_DATA}/Build/Products/Release-iphoneos/varClean.app"
          cp -r "$APP_DIR" Payload/

      - name: Sign the .app with entitlements
        run: |
          ldid -S./entitlements.plist Payload/varClean.app/varClean

      - name: Re-package IPA after signing
        run: |
          zip -r9 varClean15.tipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: varClean15
          path: varClean15.tipa

      - name: Create Release and Upload IPA (Rootless)
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: varClean15.tipa
          tag_name: rootless
          name: Rootless
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
