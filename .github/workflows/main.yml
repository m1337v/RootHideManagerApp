name: Build and Package

on:
  push:
    branches: [ rootless ]
  pull_request:
    branches: [ rootless ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rootless
            deployment_target: "15.0"
            rules_override_basename: ""
            artifact_name: varClean15
            artifact_file: varClean15.tipa
            release_tag: rootless
            release_name: Rootless
            prerelease: false
          - name: Rootful
            deployment_target: "14.0"
            rules_override_basename: varCleanRules_rootful_overrides
            artifact_name: varClean14
            artifact_file: varClean14.tipa
            release_tag: rootful
            release_name: Rootful
            prerelease: true
    env:
      DERIVED_DATA: ${{ github.workspace }}/.derivedData-${{ matrix.release_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install ldid
        run: brew install ldid

      - name: Build ${{ matrix.name }} .app with Xcode
        run: |
          rm -rf "$DERIVED_DATA" Payload "${{ matrix.artifact_file }}"
          xcodebuild -project varClean.xcodeproj \
                     -scheme varClean \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath "$DERIVED_DATA" \
                     IPHONEOS_DEPLOYMENT_TARGET=${{ matrix.deployment_target }} \
                     VARCLEAN_RULES_OVERRIDE_BASENAME=${{ matrix.rules_override_basename }} \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     build

      - name: Locate .app File and Prepare for Packaging
        run: |
          mkdir -p Payload
          APP_DIR="${DERIVED_DATA}/Build/Products/Release-iphoneos/varClean.app"
          cp -r "$APP_DIR" Payload/

      - name: Sign the .app with entitlements
        run: |
          ldid -S./entitlements.plist Payload/varClean.app/varClean

      - name: Re-package IPA after signing
        run: |
          zip -r9 "${{ matrix.artifact_file }}" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_file }}

      - name: Create Release and Upload IPA (${{ matrix.name }})
        uses: softprops/action-gh-release@v1
        if: success() && github.event_name != 'pull_request'
        with:
          files: ${{ matrix.artifact_file }}
          tag_name: ${{ matrix.release_tag }}
          name: ${{ matrix.release_name }}
          draft: false
          prerelease: ${{ matrix.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
